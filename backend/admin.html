<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OME'S ADMIN</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap');

    :root {
      --red: #C8523B;
      --maroon: #651313;
      --orange: #ED7B35;
      --cream: #FFF8E7;
      --ivory: #FDFBF7;
      --coffee: #2A1E1A;
      --green: #4B805A;
      --line: rgba(42, 30, 26, .11);
      --shadow: 0 14px 35px rgba(82, 38, 26, .12);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; color: var(--coffee); background: var(--ivory);
      font-family: "DM Sans", sans-serif; padding: 0;
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; border: 0; }
    .hidden { display: none !important; }

    .topbar {
      height: 64px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; background: var(--maroon); color: var(--cream); position: sticky; top: 0; z-index: 20;
    }
    .brand {
      font-family: Fredoka, sans-serif; font-size: 24px; font-weight: 700;
      letter-spacing: -1.2px;
    }
    .topbar-right { display: flex; gap: 10px; align-items: center; }
    .badge-notif {
      position: relative; min-height: 40px; width: 40px; border-radius: 12px;
      background: rgba(255,248,231,.15); color: var(--cream); font-size: 20px;
    }
    .badge-notif .dot {
      position: absolute; top: 8px; right: 8px; width: 10px; height: 10px;
      background: var(--orange); border-radius: 50%; border: 2px solid var(--maroon);
    }
    .refresh-btn {
      min-height: 40px; padding: 0 14px; border-radius: 12px; background: var(--orange);
      color: white; font-weight: 700; font-size: 13px;
    }

    .container { max-width: 1200px; margin: auto; padding: 20px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .stat-card {
      background: white; border-radius: 18px; padding: 18px 20px; box-shadow: 0 4px 12px rgba(68,41,31,.08);
    }
    .stat-label { font-size: 12px; color: #786964; font-weight: 700; margin-bottom: 6px; }
    .stat-value { font: 700 32px/1 Fredoka, sans-serif; color: var(--coffee); }
    .stat-card.highlight .stat-value { color: var(--red); }

    .section-head {
      display: flex; justify-content: space-between; align-items: center; margin: 24px 0 16px;
    }
    .section-head h2 { margin: 0; font: 700 28px Fredoka, sans-serif; }
    .filter-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn {
      min-height: 38px; padding: 0 14px; border-radius: 12px; background: white;
      border: 1px solid var(--line); font-size: 12px; font-weight: 700; color: var(--coffee);
    }
    .filter-btn.active { background: var(--coffee); color: var(--cream); }

    .orders-list { display: grid; gap: 12px; }
    .order-card {
      background: white; border-radius: 18px; padding: 18px; box-shadow: 0 4px 12px rgba(68,41,31,.08);
      display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: start;
    }
    .order-id-badge {
      width: 70px; height: 70px; border-radius: 16px; background: var(--cream);
      display: grid; place-items: center; font: 700 14px/1.1 Fredoka, sans-serif; color: var(--red);
      text-align: center;
    }
    .order-info { min-width: 0; }
    .order-info strong { display: block; font: 700 18px Fredoka, sans-serif; margin-bottom: 4px; }
    .order-meta { font-size: 12px; color: #786964; margin: 3px 0; }
    .order-items {
      margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line);
      font-size: 13px; line-height: 1.5;
    }
    .order-actions { display: flex; flex-direction: column; gap: 8px; }
    .status-dropdown {
      min-height: 40px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line);
      background: white; font-size: 12px; font-weight: 700; color: var(--coffee);
    }
    .action-btn {
      min-height: 40px; padding: 0 14px; border-radius: 12px; font-size: 12px; font-weight: 700;
    }
    .btn-primary { background: var(--red); color: white; }
    .btn-success { background: var(--green); color: white; }
    .btn-secondary { background: var(--cream); color: var(--coffee); }

    .empty {
      text-align: center; padding: 40px 20px; background: var(--cream); border-radius: 18px;
    }
    .empty strong { display: block; font: 700 20px Fredoka, sans-serif; margin-bottom: 6px; }
    .empty p { margin: 0; font-size: 13px; color: #786964; }

    .loading {
      position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center;
      background: rgba(253,251,247,.9); backdrop-filter: blur(4px);
    }
    .loading.show { display: flex; }
    .loader-card {
      text-align: center; padding: 28px; border-radius: 25px; background: var(--maroon); color: var(--cream); box-shadow: var(--shadow);
    }
    .spinner {
      width: 44px; height: 44px; margin: 0 auto 13px; border: 5px solid rgba(255,248,231,.25);
      border-top-color: var(--orange); border-radius: 50%; animation: spin .75s linear infinite;
    }
    .loader-card strong { font: 700 20px Fredoka, sans-serif; }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 768px) {
      .order-card { grid-template-columns: 1fr; }
      .order-actions { flex-direction: row; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">OME'S ADMIN</div>
    <div class="topbar-right">
      <button class="badge-notif" onclick="playNotifSound()" title="Notifikasi">
        🔔
        <span id="notifDot" class="dot hidden"></span>
      </button>
      <button class="refresh-btn" onclick="loadOrders()">Refresh</button>
    </div>
  </header>

  <main class="container">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">PESANAN HARI INI</div>
        <div id="statToday" class="stat-value">0</div>
      </div>
      <div class="stat-card highlight">
        <div class="stat-label">PESANAN MASUK</div>
        <div id="statPending" class="stat-value">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">SEDANG DIBUAT</div>
        <div id="statProgress" class="stat-value">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">OMSET HARI INI</div>
        <div id="statRevenue" class="stat-value">Rp0</div>
      </div>
    </div>

    <div class="section-head">
      <h2>Daftar Pesanan</h2>
      <div class="filter-group">
        <button class="filter-btn active" onclick="filterOrders('All')">Semua</button>
        <button class="filter-btn" onclick="filterOrders('Pesanan Masuk')">Masuk</button>
        <button class="filter-btn" onclick="filterOrders('Sedang Dibuat')">Dibuat</button>
        <button class="filter-btn" onclick="filterOrders('Siap Diambil')">Siap</button>
        <button class="filter-btn" onclick="filterOrders('Selesai')">Selesai</button>
      </div>
    </div>

    <div id="ordersList" class="orders-list"></div>
  </main>

  <div id="loading" class="loading">
    <div class="loader-card">
      <div class="spinner"></div>
      <strong id="loadingText">Memuat...</strong>
    </div>
  </div>

  <audio id="notifSound" src="data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//tQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAADhAC7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7//////////////////////////////////////////////////////////////////8AAAAATGF2YzU4LjEzAAAAAAAAAAAAAAAAJAAAAAAAAAAAA4To/6eZAAAAAAD/+xDEAAPAAAGkAAAAIAAANIAAAARMQU1FMy4xMDBVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV" preload="auto"></audio>

  <script>
    var allOrders = [];
    var currentFilter = 'All';
    var lastOrderCount = 0;

    document.addEventListener('DOMContentLoaded', function() {
      loadOrders();
      setInterval(loadOrders, 15000);
    });

    function serverAvailable() {
      return typeof google !== 'undefined' && google.script && google.script.run;
    }

    function loadOrders() {
      if (!serverAvailable()) {
        renderOrders([]);
        return;
      }

      google.script.run
        .withSuccessHandler(function(data) {
          allOrders = Array.isArray(data) ? data : [];
          
          var currentCount = allOrders.filter(function(o) { return o.Status === 'Pesanan Masuk'; }).length;
          if (currentCount > lastOrderCount && lastOrderCount > 0) {
            showNotification();
          }
          lastOrderCount = currentCount;

          updateStats();
          renderOrders(getFilteredOrders());
        })
        .withFailureHandler(function(error) {
          console.error('Load orders failed:', error);
        })
        .getAdminOrders();
    }

    function updateStats() {
      var today = allOrders.filter(function(o) { return isToday(o.Timestamp); });
      var pending = allOrders.filter(function(o) { return o.Status === 'Pesanan Masuk'; });
      var progress = allOrders.filter(function(o) { return o.Status === 'Sedang Dibuat'; });
      var revenue = today.reduce(function(sum, o) { return sum + Number(o.Total || 0); }, 0);

      document.getElementById('statToday').textContent = today.length;
      document.getElementById('statPending').textContent = pending.length;
      document.getElementById('statProgress').textContent = progress.length;
      document.getElementById('statRevenue').textContent = rupiah(revenue);
    }

    function isToday(timestamp) {
      var date = new Date(timestamp);
      var today = new Date();
      return date.toDateString() === today.toDateString();
    }

    function filterOrders(status) {
      currentFilter = status;
      var buttons = document.querySelectorAll('.filter-btn');
      buttons.forEach(function(btn) { btn.classList.remove('active'); });
      event.target.classList.add('active');

      renderOrders(getFilteredOrders());
    }

    function getFilteredOrders() {
      if (currentFilter === 'All') return allOrders;
      return allOrders.filter(function(o) { return o.Status === currentFilter; });
    }

    function renderOrders(orders) {
      var container = document.getElementById('ordersList');
      
      if (!orders.length) {
        container.innerHTML = '<div class="empty"><strong>Belum ada pesanan.</strong><p>Pesanan akan muncul di sini secara real-time.</p></div>';
        return;
      }

      var html = '';
      orders.forEach(function(order) {
        var items = [];
        try {
          items = JSON.parse(order['Items JSON'] || '[]');
        } catch (e) {}

        var itemsList = items.map(function(item) {
          return item.quantity + 'x ' + escapeHtml(item.name);
        }).join(', ');

        html += '<div class="order-card">';
        html += '<div class="order-id-badge">' + escapeHtml(order.OrderID) + '</div>';
        html += '<div class="order-info">';
        html += '<strong>' + escapeHtml(order['Nama Customer']) + '</strong>';
        html += '<div class="order-meta">📱 ' + escapeHtml(order['Nomor WhatsApp']) + '</div>';
        html += '<div class="order-meta">🛒 ' + escapeHtml(order['Tipe Pesanan']) + ' · ' + rupiah(order.Total) + '</div>';
        html += '<div class="order-meta">🕐 ' + formatTime(order.Timestamp) + '</div>';
        if (order.Catatan) html += '<div class="order-meta">📝 ' + escapeHtml(order.Catatan) + '</div>';
        html += '<div class="order-items">' + escapeHtml(itemsList) + '</div>';
        html += '</div>';
        html += '<div class="order-actions">';
        html += '<select class="status-dropdown" onchange="updateStatus(\'' + escapeJs(order.OrderID) + '\', this.value)">';
        html += '<option value="Pesanan Masuk"' + (order.Status === 'Pesanan Masuk' ? ' selected' : '') + '>Pesanan Masuk</option>';
        html += '<option value="Sedang Dibuat"' + (order.Status === 'Sedang Dibuat' ? ' selected' : '') + '>Sedang Dibuat</option>';
        html += '<option value="Siap Diambil"' + (order.Status === 'Siap Diambil' ? ' selected' : '') + '>Siap Diambil</option>';
        html += '<option value="Selesai"' + (order.Status === 'Selesai' ? ' selected' : '') + '>Selesai</option>';
        html += '</select>';
        html += '<button class="action-btn btn-primary" onclick="sendWhatsApp(\'' + escapeJs(order['Nomor WhatsApp']) + '\', \'' + escapeJs(order.OrderID) + '\', \'' + escapeJs(order.Status) + '\')">📱 WA</button>';
        html += '</div>';
        html += '</div>';
      });

      container.innerHTML = html;
    }

    function updateStatus(orderId, newStatus) {
      if (!serverAvailable()) return;

      showLoading('Update status...');

      google.script.run
        .withSuccessHandler(function(success) {
          hideLoading();
          if (success) {
            loadOrders();
          } else {
            alert('Gagal update status.');
          }
        })
        .withFailureHandler(function(error) {
          hideLoading();
          alert('Error: ' + (error.message || 'Update failed'));
        })
        .updateOrderStatus(orderId, newStatus);
    }

    function sendWhatsApp(phone, orderId, status) {
      var message = 'Halo! Update pesanan ' + orderId + ': ' + status;
      var url = 'https://wa.me/' + phone.replace(/\D/g, '') + '?text=' + encodeURIComponent(message);
      window.open(url, '_blank');
    }

    function showNotification() {
      document.getElementById('notifDot').classList.remove('hidden');
      playNotifSound();
      setTimeout(function() {
        document.getElementById('notifDot').classList.add('hidden');
      }, 5000);
    }

    function playNotifSound() {
      var audio = document.getElementById('notifSound');
      audio.play().catch(function() {});
    }

    function showLoading(text) {
      document.getElementById('loadingText').textContent = text || 'Memuat...';
      document.getElementById('loading').classList.add('show');
    }

    function hideLoading() {
      document.getElementById('loading').classList.remove('show');
    }

    function formatTime(timestamp) {
      var date = new Date(timestamp);
      return date.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    }

    function rupiah(value) {
      return 'Rp' + Number(value || 0).toLocaleString('id-ID');
    }

    function escapeHtml(value) {
      var div = document.createElement('div');
      div.textContent = String(value || '');
      return div.innerHTML;
    }

    function escapeJs(value) {
      return String(value || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }
  </script>
</body>
</html>
